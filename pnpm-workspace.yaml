packages:
  - shells/*
  - services/*
  - features/*
  - libs/*
  - clients/*
  - tools/*
  - infra/*

allowBuilds:
  "@parcel/watcher": false
  esbuild: true
  fallow: true
  msgpackr-extract: true

catalog:
  "@effect/atom-solid": 4.0.0-beta.93
  "@effect/language-service": 0.86.3
  "@effect/vitest": 4.0.0-beta.93
  "@mlc-ai/web-llm": 0.2.84
  "@solidjs/testing-library": 0.8.10
  "@stylexjs/stylex": 0.19.0
  "@stylexjs/unplugin": 0.19.0
  "@tailwindcss/vite": 4.3.2
  "@vitest/browser": 4.1.9
  "@vitest/browser-playwright": 4.1.9
  alien-signals: 3.2.1
  effect: 4.0.0-beta.93
  jsdom: 29.1.1
  oxfmt: 0.57.0
  oxlint: 1.72.0
  playwright: 1.61.1
  rimraf: 6.1.3
  solid-js: 1.9.14
  tailwindcss: 4.3.2
  turbo: 2.10.2
  typescript: 6.0.3
  vite: 8.1.3
  vite-plugin-solid: 2.11.12
  vitest: 4.1.9

# The livestore catalog isolates the LiveStore prototype's dependency set,
# including its effect 3.x peer line, from the workspace-wide effect 4 beta.
catalogs:
  livestore:
    "@livestore/adapter-node": 0.4.0
    "@livestore/common": 0.4.0
    "@livestore/livestore": 0.4.0
    effect: 3.21.4

catalogMode: strict
